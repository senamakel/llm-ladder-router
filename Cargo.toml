[package]
name = "llm-ladder-router"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
description = "Budget-aware routing across LLM marketplace tiers, with an OpenAI-compatible proxy."
repository = "https://github.com/senamakel/llm-ladder-router"
documentation = "https://docs.rs/llm-ladder-router"
readme = "README.md"
keywords = ["llm", "router", "openrouter", "proxy", "budget"]
categories = ["web-programming::http-server", "api-bindings"]
publish = false
# Keep the published package to what a consumer actually needs.
exclude = [
    ".github/",
    "docs/",
    "worktrees/",
    ".env.example",
    "deny.toml",
]

[lib]
name = "llm_ladder_router"
path = "src/lib.rs"

[[bin]]
# The OpenAI-compatible proxy. Kept deliberately thin: it parses arguments and
# hands straight to `proxy::serve`, so the routing logic stays library-testable.
name = "ladder"
path = "bin/ladder.rs"

[dependencies]
# Derive macros for the crate-wide error type in `src/error/mod.rs`. Every
# dependency entry should carry a comment like this one saying why it is here.
thiserror = "2"
# The proxy, the pricing refresher, and the credits poller are all concurrent
# and I/O bound; `tokio` is the single runtime the crate standardizes on.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
# HTTP server for the OpenAI-compatible surface.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
# Upstream HTTP client for marketplace calls. `rustls` avoids a system OpenSSL
# dependency; `stream` is required to relay streaming completions.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2"] }
# `config.toml` and every marketplace payload are deserialized with serde.
serde = { version = "1", features = ["derive"] }
# Marketplace bodies are relayed and patched as untyped JSON so unknown fields
# survive the round trip unchanged.
serde_json = "1"
# `config.toml` parsing.
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
# Human-readable durations (`"15m"`) in `config.toml`.
humantime-serde = "1"
# Structured routing decisions: which rung served, at what price, and why the
# rungs above it were skipped.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std"] }
# Credentials are read from the environment; `.env` is the local convenience.
dotenvy = "0.15"

[dev-dependencies]
# Integration tests bind a loopback server to assert what reaches the wire.
# `test-util` pauses the clock so the refresh loops are tested deterministically
# rather than by sleeping on the wall clock.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "test-util"] }
# Low-level HTTP for the loopback stub upstreams.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }

[features]
default = []

# Lints apply to the whole crate and to every target. CI runs clippy with
# `-D warnings`, so anything set to "warn" here fails the build in CI.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Library code must not panic on its own; tests and examples may.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
# Public fallible/panicking APIs must document their failure modes.
missing_errors_doc = "warn"
missing_panics_doc = "warn"
# Documentation hygiene.
doc_markdown = "warn"
# `#[must_use]` on pure public functions.
must_use_candidate = "warn"

[lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"

[profile.release]
# Cross-crate optimization and smaller, faster binaries for release builds.
lto = "thin"
codegen-units = 1
strip = "debuginfo"
