name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  image:
    name: Build and publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to push to GitHub Packages.
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      # Build once into the local daemon so the smoke test runs against exactly
      # the image that will be published, rather than a rebuild of it.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: llm-ladder-router:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deliberately offline: the providers point at a closed port, so the
      # startup refresh fails fast and fails soft. That proves the image starts,
      # binds, and serves without depending on a marketplace being reachable
      # from CI.
      - name: Smoke test the image
        run: |
          set -euo pipefail

          cat > offline.toml <<'CONFIG'
          [server]
          bind = "0.0.0.0:6969"
          api_key = "smoke-test-key"

          [providers.openrouter]
          kind = "openrouter"
          base_url = "http://127.0.0.1:1"
          api_key_env = "OPENROUTER_API_KEY"

          [[ladders]]
          name = "flash"
            [[ladders.rungs]]
            provider = "openrouter"
            model = "deepseek/deepseek-v4-flash"
            max_cost_per_1m = 0.30
          CONFIG

          docker run --rm --detach --name ladder-smoke \
            --publish 6969:6969 \
            --volume "$PWD/offline.toml:/etc/ladder/config.toml:ro" \
            llm-ladder-router:ci

          cleanup() { docker logs ladder-smoke || true; docker rm -f ladder-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          for _ in $(seq 1 60); do
            if curl -fsS -m 2 http://127.0.0.1:6969/healthz >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

          echo "--- healthz ---"
          curl -fsS -m 5 http://127.0.0.1:6969/healthz

          echo "--- the ladders are advertised ---"
          curl -fsS -m 5 http://127.0.0.1:6969/v1/models | tee models.json
          grep -q '"flash"' models.json

          echo "--- the configured key is enforced ---"
          status=$(curl -s -o /dev/null -w '%{http_code}' -m 5 \
            -X POST http://127.0.0.1:6969/v1/chat/completions \
            -H 'content-type: application/json' \
            -d '{"model":"flash","messages":[]}')
          test "$status" = "401" || { echo "expected 401 without a key, got $status" >&2; exit 1; }

          echo "--- it runs as an unprivileged user ---"
          test "$(docker exec ladder-smoke id -u)" = "10001"

      - name: Log in to GitHub Packages
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A second invocation with the build cache warm: nothing recompiles, it
      # only pushes the layers the first step already produced.
      - name: Publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
